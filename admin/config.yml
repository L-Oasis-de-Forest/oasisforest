# Configuration Sveltia CMS — galerie et sponsors éditables
# Doc du chantier : ../SPEC-cms.md

backend:
  name: github
  repo: tristede/oasisforest
  branch: main
  # URL du Worker Cloudflare sveltia-cms-auth (auth GitHub)
  base_url: https://oasisforest-cms-auth.tristederk.workers.dev

# Dossier où le CMS dépose les images téléversées
media_folder: img
public_folder: /img

collections:
  - name: accueil
    label: Page d'accueil
    files:
      - name: hero
        label: Photos d'en-tête (polaroids)
        file: data/hero.json
        fields:
          - name: polaroids
            label: Polaroids
            widget: list
            fields:
              - { name: legende, label: Légende, widget: string }
              - name: images
                label: Photos (une tirée au hasard à chaque visite)
                widget: list
                field:
                  name: image
                  label: Photo
                  widget: image
                  hint: "Redimensionner à 1600 px de large maximum. Format WebP de préférence."

  - name: equipe-premiere
    label: "Photo équipe première (page Équipes)"
    files:
      - name: photo
        label: Photo
        file: data/equipe-premiere.json
        fields:
          - name: photo
            label: Photo
            widget: image
            required: false
            hint: "Affichée juste sous la fiche « Équipe première » de la page Équipes. Redimensionner à 1600 px de large maximum, format WebP de préférence. Laisser vide masque le bloc proprement."

  - name: galerie
    label: Galerie photos
    files:
      - name: photos
        label: Photos
        file: data/gallery.json
        fields:
          - name: photos
            label: Photos
            widget: list
            fields:
              - name: image
                label: Photo
                widget: image
                hint: "Redimensionner à 1600 px de large maximum. Privilégier le format WebP (le JPG/PNG reste accepté)."
              - { name: legende, label: Légende, widget: string }
              - name: masquee
                label: Masquer cette photo sur tout le site
                widget: boolean
                default: false
                required: false
                hint: "À cocher tant que l'autorisation de droit à l'image n'est pas signée : la photo disparaît de la galerie, de l'accueil, des polaroids des équipes et du hero, et de la photo de l'équipe première si c'est la même image. Elle n'est pas supprimée : décochez pour la réafficher. Une photo qui n'est pas dans la galerie peut y être ajoutée uniquement pour la masquer."
              - name: categorie
                label: Catégorie
                widget: string
                required: false
                hint: "Doit correspondre exactement à la colonne « Valeur » d'un des filtres définis dans « Filtres galerie ». Sert deux fois : elle filtre la photo dans la galerie ET, si la valeur correspond à une équipe (d2, u21, u15_u17, u3), la photo illustre la fiche de cette équipe en polaroid. Laisser vide met la photo dans « Tout » uniquement."
                pattern: ['^([a-z0-9_]+)?$', "Minuscules, chiffres et underscores uniquement (ex : d2, u17), doit correspondre à une valeur de « Filtres galerie », ou rester vide."]

  - name: filtres-galerie
    label: Filtres galerie
    files:
      - name: categories
        label: Liste des filtres
        file: data/categories.json
        fields:
          - name: categories
            label: Filtres
            widget: list
            hint: "L'ordre ici est l'ordre d'affichage des boutons sur le site. Un filtre sans photo correspondante ne s'affiche pas."
            fields:
              - name: value
                label: Valeur (à utiliser dans le champ Catégorie d'une photo)
                widget: string
                pattern: ['^[a-z0-9_]+$', "Minuscules, chiffres et underscores uniquement (ex : d2, u17)."]
              - { name: label, label: "Libellé affiché", widget: string }

  - name: sponsors
    label: Sponsors
    files:
      - name: liste
        label: Liste des sponsors
        file: data/sponsors.json
        fields:
          - name: sponsors
            label: Sponsors
            widget: list
            fields:
              - name: nom
                label: Nom
                widget: string
              - name: logo
                label: Logo
                widget: image
                required: false
                hint: "Logo au format SVG ou PNG sur fond transparent de préférence. Laisser vide affiche le nom en texte."
              - { name: url, label: Site web, widget: string, required: false }
              - { name: hauteur, label: Hauteur du logo (px), widget: number, value_type: int, min: 12, max: 44, required: false, hint: "Optionnel, 28 par défaut. Un logo très large (type TELCOM) se règle plus bas (≈ 20), un logo compact avec peu de détails plus haut (≈ 40)." }
              - { name: principal, label: Sponsor maillot, widget: boolean, default: false }
              - name: demo
                label: Emplacement d'aperçu (pas un vrai partenaire)
                widget: boolean
                default: false
                required: false
                hint: "Coché : la ligne sert d'aperçu dans le bandeau (logo du club) pour montrer le rendu aux futurs sponsors. Elle n'apparaît PAS dans « Ils nous soutiennent » sur la page Partenaires. À décocher dès qu'il s'agit d'un vrai partenaire."

  - name: evenements
    label: Actu (pop-up match / détection)
    files:
      - name: liste
        label: Liste des événements
        file: data/evenements.json
        fields:
          - name: evenements
            label: Événements
            widget: list
            hint: "Un pop-up s'affiche sur le site à partir de X jours avant chaque événement, jusqu'à sa date. Une fois fermé par un visiteur, il ne réapparaît que le lendemain. N'ajouter que des échéances réelles (match, détection, portes ouvertes...), jamais de fausse urgence."
            fields:
              - name: type
                label: Type
                widget: select
                options:
                  - { label: "Match", value: "match" }
                  - { label: "Détection / Essai", value: "detection" }
                  - { label: "Portes ouvertes", value: "portes-ouvertes" }
                  - { label: "Autre", value: "autre" }
              - name: equipe
                label: "Équipe concernée (pour un Match)"
                widget: select
                required: false
                hint: "Si renseigné pour un Match, il apparaît aussi dans la modale Horaires de cette équipe (bouton Horaires sur sa fiche), en plus du pop-up."
                options:
                  - { label: "Division 2 (Nationale)", value: "div2" }
                  - { label: "U21", value: "u21" }
              - name: titre
                label: Titre
                widget: string
                hint: "Ex : Match D2 vs Anderlecht"
              - name: date
                label: Date et heure
                widget: datetime
                date_format: "DD/MM/YYYY"
                time_format: "HH:mm"
                picker_utc: false
              - name: lieu
                label: Lieu
                widget: string
                required: false
                hint: "Laisser vide pour le complexe sportif du club par défaut."
              - name: description
                label: Description courte
                widget: text
                required: false
              - name: joursAvant
                label: "Jours avant l'événement pour commencer à afficher le pop-up"
                widget: number
                default: 1
                min: 0
                max: 14
              - name: lien
                label: "Lien du bouton (optionnel)"
                widget: string
                required: false
                hint: "Ex : lien WhatsApp, Google Maps, ou page RBFA du match."
              - name: lienTexte
                label: "Texte du bouton"
                widget: string
                required: false
                default: "Plus d'infos"
