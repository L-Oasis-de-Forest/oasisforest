# Publie le site sur GitHub Pages en n'envoyant que les fichiers listés dans
# .github/build-site.sh (pas CLAUDE.md, SPEC-cms.md, README.md…).
# Réglage requis une seule fois : Settings > Pages > Source = « GitHub Actions ».
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploiement:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assembler les fichiers publics
        run: .github/build-site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
